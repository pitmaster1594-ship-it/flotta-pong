<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#090d18"><title>Flotta Pong</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none}body{height:100dvh;background:radial-gradient(circle at 50% 15%,#1e3150,#090d18 75%);color:#eff6ff;font:14px system-ui,-apple-system,sans-serif;padding:max(5px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(5px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left));display:flex;justify-content:center}.wrap{width:min(100%,1200px);height:100%;min-height:0;display:flex;flex-direction:column;text-align:center;gap:5px}h1{font-size:clamp(18px,3vw,29px);margin:0;letter-spacing:.18em;line-height:1.15}.options,.actions{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}label{display:flex;align-items:center;gap:5px;font-weight:650;color:#b9d1e1}select,button{font:inherit;font-weight:750;border-radius:12px;border:1px solid #3d5a74;padding:7px 12px;min-height:36px;color:white;background:#1b324d}button{cursor:pointer}button.primary{background:#56d7ca;color:#05282c;border-color:#56d7ca}button:active{transform:scale(.98)}button[aria-pressed=true]{background:#345b74}.panel{flex:1;min-height:0;padding:4px;border:1px solid #345071;border-radius:13px;background:#0d182c;display:flex;justify-content:center;align-items:center}canvas{width:100%;height:100%;display:block;object-fit:contain;touch-action:none;border-radius:9px;background:#0a182b}.help{color:#aac3d5;font-size:12px;margin:0;line-height:1.25;min-height:15px}@media(orientation:landscape) and (max-height:600px){.wrap{gap:3px}h1{font-size:17px}.options,.actions{gap:5px}label{font-size:12px}select,button{min-height:29px;padding:4px 10px;font-size:12px}.help{font-size:10px}.panel{padding:2px}}@media(max-width:540px){.options,.actions{gap:5px}label{font-size:12px}select,button{padding:6px 8px;min-height:33px}.help{font-size:11px}}
</style></head><body><main class="wrap"><h1>FLOTTA PONG</h1><div class="options"><label>Mode <select id="mode"><option value="cpu">Vs Computer</option><option value="two">2 Players</option></select></label><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select></label><button id="sound" aria-pressed="true">Sound: On</button></div><div class="panel"><canvas id="game" width="800" height="500" aria-label="Flotta Pong game board, touch left or right half to move corresponding paddle"></canvas></div><div class="actions"><button class="primary" id="start">Start Game</button><button id="reset">Restart</button></div><p class="help" id="help">Drag on the board to move your paddle · First to 7 wins · Space pauses</p></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),start=document.getElementById('start'),reset=document.getElementById('reset'),modeSelect=document.getElementById('mode'),difficulty=document.getElementById('difficulty'),soundButton=document.getElementById('sound'),help=document.getElementById('help');const W=800,H=500,PW=13,PH=105,margin=28,winScore=7;const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const cfg={easy:{ai:215,accuracy:0.62,base:320,cap:620},medium:{ai:310,accuracy:0.84,base:360,cap:760},hard:{ai:440,accuracy:0.98,base:390,cap:940}};let paddles=[(H-PH)/2,(H-PH)/2],ball={x:W/2,y:H/2,vx:0,vy:0,r:9},scores=[0,0],state='ready',winner='',delay=0,last=0,keys=new Set(),soundOn=true,audio=null,rally=0;const activePointers=new Map();
function getAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audio)audio=new AC();return audio}
function tone(freq,duration=.075,type='sine',volume=.16){if(!soundOn)return;try{const a=getAudio();if(!a)return;if(a.state!=='running'){a.resume().then(()=>{if(soundOn)tone(freq,duration,type,volume)}).catch(()=>{});return}const osc=a.createOscillator(),gain=a.createGain(),now=a.currentTime;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(a.destination);osc.start(now);osc.stop(now+duration+.012)}catch(_){}}
function beep(freq,duration=.075,type='sine',volume=.16){tone(freq,duration,type,volume)}
function unlockSound(){if(!soundOn)return;try{const a=getAudio();if(a&&a.state!=='running')a.resume().catch(()=>{})}catch(_){}}
document.addEventListener('pointerdown',unlockSound,{capture:true});document.addEventListener('touchstart',unlockSound,{capture:true,passive:true});
function isTwo(){return modeSelect.value==='two'}function config(){return cfg[difficulty.value]}function sync(){start.textContent=state==='play'?'Pause':state==='pause'?'Resume':state==='over'?'Play Again':'Start Game';difficulty.disabled=isTwo();help.textContent=isTwo()?'Two players: one finger on each side · Left: W/S · Right: ↑/↓':'Drag your finger to move your paddle · ↑/↓ or W/S · Space pauses';}
function fresh(){scores=[0,0];paddles=[(H-PH)/2,(H-PH)/2];ball={x:W/2,y:H/2,vx:0,vy:0,r:9};state='ready';winner='';delay=0;rally=0;activePointers.clear();sync()}
function serve(toward=1){const speed=config().base;ball.x=W/2;ball.y=H/2;ball.vx=toward*speed;ball.vy=(Math.random()*.8-.4)*speed;rally=0;delay=.7;}
function toggle(){if(state==='over')fresh();if(state==='ready'){state='play';serve(Math.random()<.5?-1:1);beep(500,.09)}else if(state==='play')state='pause';else if(state==='pause')state='play';sync()}
function point(side){scores[side]++;beep(180,.19,'triangle');if(scores[side]>=winScore){state='over';winner=side===0?'LEFT PLAYER WINS!':isTwo()?'RIGHT PLAYER WINS!':'COMPUTER WINS!';ball.vx=ball.vy=0;beep(side===0?690:240,.3)}else serve(side===0?1:-1);sync()}
function hit(side){const p=paddles[side],right=side===1,edge=right?W-margin-PW:margin+PW;if(ball.y+ball.r<p||ball.y-ball.r>p+PH)return false;if(right?(ball.x+ball.r<edge||ball.vx<=0):(ball.x-ball.r>edge||ball.vx>=0))return false;ball.x=right?edge-ball.r:edge+ball.r;const angle=clamp((ball.y-(p+PH/2))/(PH/2),-1,1)*.95;const current=Math.hypot(ball.vx,ball.vy);const max=isTwo()?850:config().cap;const speed=Math.min(max,current*1.07+7);ball.vx=(right?-1:1)*Math.max(.38,Math.cos(angle))*speed;ball.vy=Math.sin(angle)*speed;rally++;beep(340+Math.min(rally,20)*21,.055);return true}
function update(dt){if(state!=='play')return;const speed=580;if(keys.has('w'))paddles[0]-=speed*dt;if(keys.has('s'))paddles[0]+=speed*dt;if(keys.has('ArrowUp'))paddles[isTwo()?1:0]-=speed*dt;if(keys.has('ArrowDown'))paddles[isTwo()?1:0]+=speed*dt;paddles[0]=clamp(paddles[0],0,H-PH);if(!isTwo()){const settings=config(),target=clamp(ball.y-PH/2+(1-settings.accuracy)*Math.sin(last/580)*90,0,H-PH),chase=ball.vx>0?target:(H-PH)/2;paddles[1]+=clamp(chase-paddles[1],-settings.ai*dt,settings.ai*dt)}paddles[1]=clamp(paddles[1],0,H-PH);if(delay>0){delay-=dt;return}const steps=Math.max(1,Math.ceil(Math.max(Math.abs(ball.vx),Math.abs(ball.vy))*dt/7)),step=dt/steps;for(let i=0;i<steps&&state==='play';i++){ball.x+=ball.vx*step;ball.y+=ball.vy*step;if(ball.y-ball.r<=0){ball.y=ball.r;ball.vy=Math.abs(ball.vy);beep(260,.03)}if(ball.y+ball.r>=H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy);beep(260,.03)}if(ball.vx<0&&ball.x-ball.r<=margin+PW)hit(0);if(ball.vx>0&&ball.x+ball.r>=W-margin-PW)hit(1);if(ball.x<-ball.r){point(1);break}if(ball.x>W+ball.r){point(0);break}}}
function text(s,size,y,color='#e8f5ff'){ctx.fillStyle=color;ctx.font=`800 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,W/2,y)}function draw(){const x=ctx;x.clearRect(0,0,W,H);x.fillStyle='#0a182b';x.fillRect(0,0,W,H);x.strokeStyle='#28435b';x.lineWidth=4;x.setLineDash([11,16]);x.beginPath();x.moveTo(W/2,20);x.lineTo(W/2,H-20);x.stroke();x.setLineDash([]);x.strokeStyle='#1b3954';x.lineWidth=3;x.beginPath();x.arc(W/2,H/2,80,0,Math.PI*2);x.stroke();x.fillStyle='#56d7ca';x.fillRect(margin,paddles[0],PW,PH);x.fillStyle='#fecc78';x.fillRect(W-margin-PW,paddles[1],PW,PH);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle='#f6faff';x.shadowColor='#d4edff';x.shadowBlur=14;x.fill();x.shadowBlur=0;x.textAlign='center';x.font='800 58px system-ui';x.fillStyle='#56d7ca';x.fillText(scores[0],W/2-92,75);x.fillStyle='#fecc78';x.fillText(scores[1],W/2+92,75);x.font='bold 14px system-ui';x.fillStyle='#85abc4';x.fillText(isTwo()?'PLAYER 1':'YOU',W/2-92,101);x.fillText(isTwo()?'PLAYER 2':'COMPUTER',W/2+92,101);if(state!=='play'){x.fillStyle='#07111dcc';x.fillRect(0,0,W,H);if(state==='ready'){text('READY TO PLAY?',38,235);text('Tap Start Game',19,277,'#9ed0df')}else if(state==='pause'){text('PAUSED',42,246);text('Tap Resume to continue',18,285,'#9ed0df')}else{text(winner,35,235,'#56d7ca');text(`${scores[0]} – ${scores[1]}   ·   Tap Play Again`,19,278,'#d4e9f4')}}}
function loop(t){const dt=Math.min((t-last)/1000||0,.032);last=t;update(dt);draw();requestAnimationFrame(loop)}
function position(e){const rect=c.getBoundingClientRect(),scale=Math.min(rect.width/W,rect.height/H),actualWidth=W*scale,actualHeight=H*scale,left=rect.left+(rect.width-actualWidth)/2,top=rect.top+(rect.height-actualHeight)/2;return{x:(e.clientX-left)/scale,y:(e.clientY-top)/scale}}function movePointer(e){const pos=position(e),side=isTwo()?(pos.x<W/2?0:1):0;if(activePointers.has(e.pointerId)){const saved=activePointers.get(e.pointerId);paddles[saved]=clamp(pos.y-PH/2,0,H-PH)}else{activePointers.set(e.pointerId,side);paddles[side]=clamp(pos.y-PH/2,0,H-PH)}}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);movePointer(e)});c.addEventListener('pointermove',e=>{if(activePointers.has(e.pointerId)){e.preventDefault();movePointer(e)}},{passive:false});for(const ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,e=>activePointers.delete(e.pointerId));c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Space'].includes(e.code)||e.key===' ')e.preventDefault();keys.add(e.key.length===1?e.key.toLowerCase():e.key);if(e.code==='Space'&&!e.repeat)toggle()});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));modeSelect.addEventListener('change',fresh);difficulty.addEventListener('change',fresh);soundButton.addEventListener('click',()=>{soundOn=!soundOn;soundButton.textContent=`Sound: ${soundOn?'On':'Off'}`;soundButton.setAttribute('aria-pressed',String(soundOn));if(soundOn){unlockSound();beep(660,.14,'triangle',.22)}});start.addEventListener('click',toggle);reset.addEventListener('click',fresh);sync();requestAnimationFrame(loop);
})();
</script></body></html>
