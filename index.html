<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Pong</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}body{margin:0;height:100dvh;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 15%,#1e3150,#090d18 75%);color:#eff6ff;font:16px system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:8px;overscroll-behavior:none}.wrap{width:min(100%,1200px);height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;text-align:center}h1{font-weight:850;letter-spacing:.25em;margin:0 0 3px;font-size:clamp(24px,5vw,38px)}.sub{color:#a7bed8;margin:0 0 6px;font-size:14px}.panel{border:1px solid #345071;border-radius:18px;background:#0d182c;box-shadow:0 20px 70px #0007;padding:5px;min-height:0;display:flex;align-items:center;justify-content:center;flex:1}canvas{width:100%;height:100%;object-fit:contain;display:block;aspect-ratio:16/10;border-radius:12px;background:#091427;touch-action:none}.controls{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0}button{background:#56d7ca;border:0;border-radius:999px;color:#062329;font-weight:800;padding:12px 24px;font-size:16px;cursor:pointer;min-height:46px}button:active{transform:scale(.97)}.help{color:#b3c6d7;font-size:14px;line-height:1.5;margin:3px 0}.legend{color:#63ddcd;font-weight:700}
@media (orientation:landscape){h1{font-size:20px}.sub,.help{font-size:11px}.controls{margin:3px 0}button{min-height:36px;padding:6px 16px}}
</style></head><body><main class="wrap"><h1>PONG</h1><p class="sub">You vs Computer · First to 7 wins</p><div class="panel"><canvas id="game" width="800" height="500" aria-label="Pong game board"></canvas></div><div class="controls"><button id="start">Start Game</button><button id="reset">Restart</button></div><p class="help"><span class="legend">iPad:</span> drag your finger up and down on the game board. <span class="legend">Keyboard:</span> ↑ / ↓ or W / S. Space to pause.</p></main>
<script>
(()=>{'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),start=document.getElementById('start'),reset=document.getElementById('reset');const W=800,H=500,PW=13,PH=105,margin=28;let you=H/2-PH/2,ai=you,ball={x:W/2,y:H/2,vx:0,vy:0,r:9},score=[0,0],mode='ready',keys=new Set(),last=0,delay=0,winner='';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));function serve(to=1){ball.x=W/2;ball.y=H/2;const speed=370;ball.vx=speed*to;ball.vy=(Math.random()*.9-.45)*speed;delay=.7;}
function fresh(){score=[0,0];you=ai=H/2-PH/2;mode='ready';winner='';ball={x:W/2,y:H/2,vx:0,vy:0,r:9};start.textContent='Start Game';}
function toggle(){if(mode==='over'){fresh();}if(mode==='ready'){mode='play';serve(Math.random()<.5?-1:1)}else if(mode==='play'){mode='pause'}else if(mode==='pause'){mode='play'}start.textContent=mode==='play'?'Pause':mode==='pause'?'Resume':mode==='over'?'Play Again':'Start Game';}
function point(side){score[side]++;if(score[side]>=7){mode='over';winner=side===0?'YOU WIN!':'COMPUTER WINS';start.textContent='Play Again';ball.vx=ball.vy=0;}else serve(side===0?1:-1);}
function hit(pad,right){if(ball.y+ball.r<pad||ball.y-ball.r>pad+PH)return false;const edge=right?W-margin-PW:margin+PW;if(right?ball.x+ball.r<edge:ball.x-ball.r>edge)return false;ball.x=right?edge-ball.r:edge+ball.r;const angle=clamp((ball.y-(pad+PH/2))/(PH/2),-1,1)*.95;const speed=Math.min(790,Math.hypot(ball.vx,ball.vy)*1.055+6);ball.vx=(right?-1:1)*speed*Math.cos(angle);ball.vy=speed*Math.sin(angle);return true;}
function update(dt){if(mode!=='play')return;if(keys.has('ArrowUp')||keys.has('w'))you-=540*dt;if(keys.has('ArrowDown')||keys.has('s'))you+=540*dt;you=clamp(you,0,H-PH);const target=clamp(ball.y-PH/2,0,H-PH);let chase=ball.vx>0?target:H/2-PH/2;ai+=clamp(chase-ai,-310*dt,310*dt);ai=clamp(ai,0,H-PH);if(delay>0){delay-=dt;return}ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.y-ball.r<=0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.y+ball.r>=H){ball.y=H-ball.r;ball.vy=-Math.abs(ball.vy)}if(ball.vx<0&&ball.x-ball.r<=margin+PW)hit(you,false);if(ball.vx>0&&ball.x+ball.r>=W-margin-PW)hit(ai,true);if(ball.x<-ball.r)point(1);if(ball.x>W+ball.r)point(0);}
function text(s,size,y,color='#e8f5ff'){x.fillStyle=color;x.font=`800 ${size}px system-ui`;x.textAlign='center';x.fillText(s,W/2,y)}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#0a182b';x.fillRect(0,0,W,H);x.strokeStyle='#28435b';x.lineWidth=4;x.setLineDash([11,16]);x.beginPath();x.moveTo(W/2,20);x.lineTo(W/2,H-20);x.stroke();x.setLineDash([]);x.strokeStyle='#1b3954';x.lineWidth=3;x.beginPath();x.arc(W/2,H/2,80,0,Math.PI*2);x.stroke();x.fillStyle='#56d7ca';x.fillRect(margin,you,PW,PH);x.fillStyle='#fecc78';x.fillRect(W-margin-PW,ai,PW,PH);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle='#f6faff';x.shadowColor='#d4edff';x.shadowBlur=16;x.fill();x.shadowBlur=0;x.textAlign='center';x.font='800 58px system-ui';x.fillStyle='#56d7ca';x.fillText(score[0],W/2-92,75);x.fillStyle='#fecc78';x.fillText(score[1],W/2+92,75);x.font='bold 14px system-ui';x.fillStyle='#85abc4';x.fillText('YOU',W/2-92,101);x.fillText('COMPUTER',W/2+92,101);if(mode!=='play'){x.fillStyle='#07111dcc';x.fillRect(0,0,W,H);if(mode==='ready'){text('READY TO PLAY?',38,235);text('Tap Start Game',19,277,'#9ed0df')}else if(mode==='pause'){text('PAUSED',42,246);text('Tap Resume to continue',18,285,'#9ed0df')}else {text(winner,43,235,winner==='YOU WIN!'?'#56d7ca':'#fecc78');text(`${score[0]} – ${score[1]}   ·   Tap Play Again`,19,278,'#d4e9f4')}}}
function loop(t){const dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);draw();requestAnimationFrame(loop)}function move(e){const r=c.getBoundingClientRect();const scale=Math.min(r.width/W,r.height/H);const actualHeight=H*scale;const top=r.top+(r.height-actualHeight)/2;you=clamp((e.clientY-top)*H/actualHeight-PH/2,0,H-PH)}c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0){e.preventDefault();move(e)}},{passive:false});c.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase()==='w'?'w':e.key.toLowerCase()==='s'?'s':e.key);if(e.code==='Space'&&!e.repeat)toggle()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()==='w'?'w':e.key.toLowerCase()==='s'?'s':e.key));start.addEventListener('click',toggle);reset.addEventListener('click',fresh);requestAnimationFrame(loop);
})();
</script></body></html>
